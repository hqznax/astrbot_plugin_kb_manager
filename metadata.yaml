name: astrbot_plugin_kb_manager
display_name: 知识库管理
desc: 聊天命令 + WebUI 独立界面，支持查看、修改、删除、新建知识库文档
help: |
  命令：
  - 知识库列表：查看所有知识库
  - 知识库文件 <知识库名|编号> [页码]：查看文档列表
  - 知识库详情 <知识库名|编号> <文档编号|文档ID|文件名>：查看文档详情
  - 知识库删除文件 <知识库名|编号> <文档编号|文档ID|文件名>：删除文档（需确认）
  - 知识库批量删除 <知识库名|编号> <编号/ID/文件名...>：批量删除多个文档（需确认）
  - 知识库批量删除 <知识库名|编号> 匹配 <关键词>：按文件名关键词批量删除（需确认）
  - 知识库确认删除：确认上一次删除
  - 知识库取消删除：取消待确认删除
  - 知识库界面：查看 WebUI 入口

  WebUI：
  - AstrBot WebUI → 插件 → 知识库管理 → Pages → dashboard
  - 支持查看 / 搜索 / 编辑正文 / 删除 / 新建纯文本文档
  - 保存修改会删除旧文档并以新内容重新入库（重建向量）
version: v1.2.0
author: 沐瑶
repo: https://github.com/hqznax/astrbot_plugin_kb_manager
astrbot_version: ">=4.16,<5"
